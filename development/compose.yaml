## Beschreibung

# required for userns_mode
x-podman:
  in_pod: false


services:
  # The development container running the app
  sportyweb-dev:
    container_name: ${DEV_CONTAINER_NAME:-sportyweb-dev}
    image: ${DEV_IMAGE_NAME:-localhost/sportyweb-dev}:${DEV_IMAGE_TAG:-latest}
    # Rootless mode UID/GID Mapping
    # UID/GID has to match the user in the Containerfile
    userns_mode: "keep-id:uid=1000,gid=1000"  
    build:
      context: .
      target: ${DEV_IMAGE_TARGET:-swdev}
      dockerfile: Containerfile

    volumes:
      # Home folder of the user, keeps command history
      - workspaces:/workspaces
      # Mounts the folder of the repository on the host to the container
      - ../:/workspaces/sportyweb
     
      # uses the customizable env file created, if there is none, copy and adjust the template
    env_file:
      - .env
    environment:
      # Used to detect if a its a container
      IN_CONTAINER: "true"
      # If this var exists, the webserver binds to 0.0.0.0 inside the container, instead of 127.0.0.1
      #  which would not be accessible by a browser on the host
      SW_LISTEN_ANY: "true"
      # Sets Database Url for MIX_ENV prod from .env
      DATABASE_URL: ecto://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}/${POSTGRES_DB}
      # Provides credentials for the s3 client from .env
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}


    # Binds only to localhost, so the webserver is not reachable from other machines
    ports:
      - target: 4000
        published: 4000
        host_ip: 127.0.0.1

  # The container running the database
  postgresql:
    # has to match version with postgresql-client from the development container
    image: docker.io/library/postgres:15.19-trixie 
    restart: unless-stopped
    volumes:
      - data-db:/var/lib/postgresql
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}


# This container runs the s3 storage for documents
  s3:
    image: docker.io/rustfs/rustfs:1.0.0
    restart: unless-stopped
    volumes:
      - data-s3:/data
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_ADDRESS: ${RUSTFS_ADDRESS}
      RUSTFS_CONSOLE_ADDRESS: ${RUSTFS_CONSOLE_ADDRESS}
      RUSTFS_CONSOLE_ENABLE: ${RUSTFS_CONSOLE_ENABLE}
      RUSTFS_OBS_LOGGER_LEVEL: ${RUSTFS_OBS_LOGGER_LEVEL}

    # Port 9001 is for the Webconsole
    ports:
     - target: 9001
       published: 9001
       host_ip: 127.0.0.1



# Named volumes
volumes:
  workspaces:
  data-db:
  data-s3:  
